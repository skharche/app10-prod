<html>
	<head>
		<style>
			/* Main modal wrapper */
			.fullScreenModalWindow {
				position: fixed;          /* stays fixed */
				top: 0;
				left: 0;
				width: 100%;              /* full width overlay */
				height: 100%;             /* full screen height */
				background-color: rgba(0, 0, 0, 0.5); /* dim background */
				display: none;            /* hidden by default */
				z-index: 9999;            /* always on top */
				overflow: auto;           /* enables scrollbar if content exceeds */
			}

			/* Modal content box */
			.fullscreenmodal-content {
				position: relative;
				margin: 0 auto;          /* horizontally centered */
				top: 0;                  /* stick to top */
				background: #fff;
				border-radius: 8px;
				padding: 20px;
				display: inline-block;   /* shrink to fit content width */
				max-height: 100vh;       /* never exceed screen height */
				overflow-y: auto;        /* scrollbar inside if content too tall */
				box-sizing: border-box;
			}

			/* Close button */
			.close {
				position: absolute;
				top: 10px;
				right: 15px;
				font-size: 28px;
				font-weight: bold;
				cursor: pointer;
				color: #333;
			}

			/* Title */
			.fullscreenmodal-title {
				font-size: 20px;
				font-weight: bold;
				display: block;
				margin-bottom: 10px;
			}

			/* Flex row for images/content */
			.row {
				display: flex;
				align-items: center;
				justify-content: center;
				width: auto;              /* adjusts width automatically */
				height: auto;
				gap: 10px;                /* spacing between columns */
			}

			/* Left / Right / Center sections */
			.modal-left, .modal-right, .modal-center {
				display: flex;
				align-items: center;
				justify-content: center;
			}

			/* Example: center takes natural size of its image */
			.modal-center img,
			.modal-right img,
			.modal-left img {
				max-height: 80vh;         /* so images never exceed screen height */
				height: auto;
				width: auto;
			}
		</style>
	</head>
	<body>
		<div id="fullScreenModal" class="fullScreenModalWindow">
			<div class="fullscreenmodal-content">
				<span class="fullscreenmodal-title"></span>
				<span id="closeModal" class="close" onClick="closeFullScreenModal();">&times;</span>
				<br />
				<div class="row" style="width:100%; height: 100px; display: flex;">
					<div class="modal-left" ></div>
					<div class="modal-right" ></div>
				</div>
				<span class="fullscreen-buildingname"></span>
				<br clear="all">
				<span class="fullscreen-innter-content"></span>
			</div>
		</div>
	</body>
</html>
