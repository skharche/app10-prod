<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Modal Layout</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Move modal to top with padding */
    .modal-dialog {
      margin-top: 30px;  /* adjust top padding */
    }
    .modal-body .row {
      display: flex;
      align-items: center;
    }
    .modal-left,
    .modal-right {
      flex: 1;
      text-align: center;
      padding: 10px;
    }
    .modal-center {
      flex: 2; /* bigger center column for image */
      text-align: center;
      padding: 10px;
    }
    .modal-right {
      background: #f8f9fa; /* subtle background */
      border-radius: 5px;
    }
  </style>
</head>
<body class="bg-light p-5">

  <!-- Button to trigger modal -->
  <div class="text-center">
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#customModal">
      Open Custom Modal
    </button>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="customModal" tabindex="-1" aria-labelledby="customModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl"> <!-- Wide modal -->
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="customModalLabel">Custom Layout Modal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        
        <div class="modal-body text-center">
          <div class="row w-100">
            <div class="modal-left">
              <strong>Text Content</strong><br>ABC
            </div>
            
            <div class="modal-center">
              <img src="https://picsum.photos/1000/600" alt="Sample" class="img-fluid rounded">
            </div>
            
            <div class="modal-right">
              Small Image container
            </div>
          </div>
        </div>
        
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
